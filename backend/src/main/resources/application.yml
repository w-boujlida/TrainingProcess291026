server:
  port: 8080

spring:
  application:
    name: training-process
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:training_process}
    username: ${DB_USER:training}
    password: ${DB_PASSWORD:training}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:change-me-please-change-me-please-32b}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}

app:
  super-admin:
    username: ${SUPERADMIN_USERNAME:superadmin}
    password: ${SUPERADMIN_PASSWORD:ChangeMe@2026}
    full-name: ${SUPERADMIN_FULLNAME:Super Administrateur}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3002}
  security:
    max-failed-attempts: 5
    lock-minutes: 15
