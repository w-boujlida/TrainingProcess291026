services:

  postgres:
    image: postgres:16-alpine
    container_name: "${PROJECT_NAME:-training}-postgres"
    restart: unless-stopped
    ports:
      - "0.0.0.0:${DB_PUBLIC_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-training_process}
      POSTGRES_USER: ${DB_USER:-training}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Africa/Tunis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-training} -d ${DB_NAME:-training_process}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: "${PROJECT_NAME:-training}-backend"
    restart: unless-stopped
    ports:
      - "0.0.0.0:${BACKEND_PORT:-8082}:8080"
    environment:
      TZ: Africa/Tunis
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-training_process}
      DB_USER: ${DB_USER:-training}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: "http://${SERVER_HOST:-localhost}:${FRONTEND_PORT:-3002},http://localhost:5173"
      AUDIT_TRUSTED_PROXY_HOST: frontend
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: "${PROJECT_NAME:-training}-frontend"
    restart: unless-stopped
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-3002}:80"
    depends_on:
      - backend

volumes:
  pgdata:
